
services:
  # ==================================
  # POSTGRESQL
  # ==================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================================
  # SQL SERVER
  # ==================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campus-network

  # ==================================
  # PGADMIN
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network

  # ==================================
  # NEO4J
  # ==================================
  neo4j:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - campus-network

  # ==================================
  # MONGODB
  # ==================================
  mongo:
    image: mongo:8.0.8-noble
    container_name: campuscloud-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - campus-network

  # ==================================
  # CASSANDRA - UNIDAD II
  # ==================================
  cassandra:
    image: cassandra:4.1
    container_name: campuscloud-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: CampusCloud
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

# ==================================
# VOLUMENES
# ==================================
volumes:
  postgres_data:
    external: true
    name: campuscloud_postgres_data

  pgadmin_data:
    external: true
    name: campuscloud_pgadmin_data

  sqlserver_data:
    external: true
    name: campuscloud-sql-data

  neo4j_data:
    external: true
    name: campuscloud_neo4j_data

  mongo_data:
    external: true
    name: campuscloud_mongo_data

  cassandra_data:
    name: campuscloud_cassandra_data

# ==================================
# RED EXTERNA
# ==================================
networks:
  campus-network:
    external: true
    name: campus-network
