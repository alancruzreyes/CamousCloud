services:
  # Base de datos postgres
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "CampusCloudPostgres#"
      POSTGRES_DB: "campuscloud"
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net

  # pgadmin
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

# VOLUMENES
volumes:
  postgres_data:
    external: true
    name: POSTGRES_VOLUME
  pgadmin_data:
    external: true
    name: PGADMIN_VOLUME

# RED
networks:
  campuscloud_net:
    external: true
    name:${DOCKER_NETWORK}