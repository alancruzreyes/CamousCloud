services:
  # Base de datos postgres
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "CampusCloudPostgres#"
      POSTGRES_DB: "campuscloud"
    ports:
      - "54320:5432"
    volumes:
      - campuscloud_postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    

  # pgadmin
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8082:80"
    depends_on:
      postgres-cloud:
        condition: service_healthy
    volumes:
      - campuscloud_pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network

# VOLUMENES
volumes:
  postgres_data:
  
  pgadmin_data:
   

# RED
networks:
  campus-network:
    external: true